  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">📈</span>
      <div>
        <h1>三剑客学习手册</h1>
        <p class="subtitle">道氏 · 斐波那契 · 缠论 · A股实战路线</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">学习进度 <span id="progress-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </header>

  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="week-group" data-week="1">
        <div class="week-title">第 1 周 · 道氏基础</div>
        <button class="lesson-btn active" data-lesson="1-1">1-1 三种趋势</button>
        <button class="lesson-btn" data-lesson="1-2">1-2 高低点结构</button>
        <button class="lesson-btn" data-lesson="1-3">1-3 牛熊判断</button>
      </div>
      <div class="week-group" data-week="2">
        <div class="week-title">第 2 周 · 道氏实战</div>
        <button class="lesson-btn" data-lesson="2-1">2-1 量价验证</button>
        <button class="lesson-btn" data-lesson="2-2">2-2 趋势线画法</button>
        <button class="lesson-btn" data-lesson="2-3">2-3 A股案例</button>
      </div>
      <div class="week-group" data-week="3">
        <div class="week-title">第 3 周 · 斐波那契入门</div>
        <button class="lesson-btn" data-lesson="3-1">3-1 黄金分割原理</button>
        <button class="lesson-btn" data-lesson="3-2">3-2 四个核心回撤位</button>
        <button class="lesson-btn" data-lesson="3-3">3-3 画线工具使用</button>
      </div>
      <div class="week-group" data-week="4">
        <div class="week-title">第 4 周 · 斐波那契进阶</div>
        <button class="lesson-btn" data-lesson="4-1">4-1 扩展位测量</button>
        <button class="lesson-btn" data-lesson="4-2">4-2 时间窗口</button>
        <button class="lesson-btn" data-lesson="4-3">4-3 实战复盘</button>
      </div>
      <div class="week-group" data-week="5">
        <div class="week-title">第 5 周 · 缠论基础</div>
        <button class="lesson-btn" data-lesson="5-1">5-1 分型识别</button>
        <button class="lesson-btn" data-lesson="5-2">5-2 笔的画法</button>
        <button class="lesson-btn" data-lesson="5-3">5-3 线段初识</button>
      </div>
      <div class="week-group" data-week="6">
        <div class="week-title">第 6 周 · 缠论核心</div>
        <button class="lesson-btn" data-lesson="6-1">6-1 中枢概念</button>
        <button class="lesson-btn" data-lesson="6-2">6-2 三类买卖点</button>
        <button class="lesson-btn" data-lesson="6-3">6-3 区间套</button>
      </div>
      <div class="week-group" data-week="7">
        <div class="week-title">第 7 周 · 三剑合璧</div>
        <button class="lesson-btn" data-lesson="7-1">7-1 联合作战模型</button>
        <button class="lesson-btn" data-lesson="7-2">7-2 仓位管理</button>
        <button class="lesson-btn" data-lesson="7-3">7-3 毕业复盘</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="content" id="content">
      <!-- 内容由 JS 动态注入 -->
    </main>
  </div>

  <!-- 底部笔记栏 -->
  <div class="note-bar" id="note-bar">
    <button class="note-toggle" id="note-toggle">📝 我的笔记</button>
    <div class="note-panel" id="note-panel" hidden>
      <div class="note-head">
        <span>学习笔记（自动保存到本地）</span>
        <button id="note-clear">清空</button>
      </div>
      <textarea id="note-area" placeholder="在这里记录你的思考、疑问、灵感...&#10;关闭后会保存到浏览器本地。"></textarea>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

  </div>
  <div class="minimax-close-icon">×</div>
</div>
<script>
// Initialize floating ball functionality
function initFloatingBall() {
  const ball = document.getElementById('minimax-floating-ball');
  if (!ball) return;

  // Initial animation
  ball.style.opacity = '0';
  ball.style.transform = 'translateY(20px)';

  setTimeout(() => {
    ball.style.opacity = '1';
    ball.style.transform = 'translateY(0)';
  }, 500);

  // Handle logo click
  const ballContent = ball.querySelector('.minimax-ball-content');
  ballContent.addEventListener('click', function (e) {
    e.stopPropagation();
    window.open('https://agent.minimax.cn/', '_blank');
    ball.style.transform = 'scale(0.95)';
    setTimeout(() => {
      ball.style.transform = 'scale(1)';
    }, 100);
  });

  // Handle close button click
  const closeIcon = ball.querySelector('.minimax-close-icon');
  closeIcon.addEventListener('click', function (e) {
    e.stopPropagation();
    ball.style.opacity = '0';
    ball.style.transform = 'translateY(20px)';

    setTimeout(() => {
      ball.style.display = 'none';
    }, 300);
  });
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', initFloatingBall); 
</script>
